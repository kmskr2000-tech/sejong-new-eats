name: 세종 신규 식당 수집

on:
  schedule:
    - cron: "17 22 * * *"   # 매일 07:17 KST
    - cron: "17 9 * * *"    # 매일 18:17 KST
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyproj
      - name: 공공데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch.py
      - name: 변경분 커밋
        run: |
          git config user.name "sejong-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/restaurants.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 갱신"
          git push
